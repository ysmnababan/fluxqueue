services:
  mailhog:
    container_name: mailhog
    image: mailhog/mailhog:v1.0.1
    ports:
      - 1025:1025
      - 8025:8025
    networks:
      - monitoring
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - monitoring
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8080:8080"
    depends_on:
      - redis
    networks:
      - monitoring
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
    command: ["-mode=api"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
    networks:
      - monitoring
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
    command: ["-mode=worker"]
    expose:
      - "8090"

  prometheus:
    image: prom/prometheus:v2.53.5
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prom_targets:/etc/prometheus/file_sd:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - monitoring

  prom-sd-generator:
    image: docker:cli
    container_name: prom-sd-generator
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./prom_targets:/prom_targets
      - ./scripts:/scripts:ro
    networks:
      - monitoring
    entrypoint:
      [
        "sh",
        "-c",
        "while true; do /scripts/generate_worker_sd.sh /prom_targets/worker_targets.json fluxqueue_monitoring worker; sleep 10; done",
      ]

  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - "grafana-storage:/var/lib/grafana"
    networks:
      - monitoring
    environment:
      - GR_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-storage:

networks:
  monitoring:
    driver: bridge
