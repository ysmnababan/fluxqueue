all: false
force-file-write: true
formatter: goimports
log-level: info
recursive: false
template: testify
packages:
  fluxqueue/internal/api/http/handler:
    config:
      dir: "{{.InterfaceDir}}"
      filename: "{{.InterfaceName}}_mock_test.go"
      pkgname: "{{.SrcPackageName}}"
      structname: "Mock{{.InterfaceName}}"
    interfaces:
      IRedisClient:
  fluxqueue/internal/service:
    config:
      dir: "{{.InterfaceDir}}"
      filename: "{{.InterfaceName}}_mock_test.go"
      pkgname: "{{.SrcPackageName}}"
      structname: "Mock{{.InterfaceName}}"
    interfaces:
      IStorage:
      IEmail:
  fluxqueue/internal/scheduler:
    config:
      dir: "{{.InterfaceDir}}"
      filename: "{{.InterfaceName}}_mock_test.go"
      pkgname: "{{.SrcPackageName}}"
      structname: "Mock{{.InterfaceName}}"
    interfaces:
      IRedisClient:
  fluxqueue/internal/worker:
    config:
      dir: "{{.InterfaceDir}}"
      filename: "{{.InterfaceName}}_mock_test.go"
      pkgname: "{{.SrcPackageName}}"
      structname: "Mock{{.InterfaceName}}"
    interfaces:
      IRedisClient:
